name: Backend CI/CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_FILE: CleaningServiceApp/CleaningServiceApp.sln
  API_PROJECT: CleaningServiceApp/CleaningService.API/CleaningService.API.csproj
  UNIT_TEST_PROJECT: CleaningServiceApp/tests/Cleaning.BLL.Tests/Cleaning.BLL.Tests.csproj
  INTEGRATION_TEST_PROJECT: CleaningServiceApp/tests/CleaningService.API.Tests/CleaningService.API.Tests.csproj

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"
      - name: Verify formatting
        run: dotnet format "${{ env.SOLUTION_FILE }}" --verify-no-changes --no-restore --verbosity minimal
      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore --disable-build-servers /m:1 /p:UseSharedCompilation=false
      - name: Publish API
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --no-restore --disable-build-servers /m:1 /p:UseSharedCompilation=false --output ./artifacts/api
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-api
          path: ./artifacts/api

  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore "${{ env.UNIT_TEST_PROJECT }}"
      - name: Run unit tests
        run: dotnet test "${{ env.UNIT_TEST_PROJECT }}" --configuration Release --no-restore --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage" --results-directory ./artifacts/unit-tests
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: ./artifacts/unit-tests
          if-no-files-found: ignore

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore "${{ env.INTEGRATION_TEST_PROJECT }}"
      - name: Run API integration tests
        run: dotnet test "${{ env.INTEGRATION_TEST_PROJECT }}" --configuration Release --no-restore --logger "trx;LogFileName=integration-tests.trx" --collect:"XPlat Code Coverage" --results-directory ./artifacts/integration-tests
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: ./artifacts/integration-tests
          if-no-files-found: ignore

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CleaningServiceApp
          file: ./CleaningServiceApp/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-quality, backend-unit-tests, backend-integration-tests, docker-validation]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CleaningServiceApp
          file: ./CleaningServiceApp/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cleaning-api:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cleaning-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
