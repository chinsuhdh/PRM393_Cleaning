name: Backend Docker CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'CleaningServiceApp/**' # Chỉ trigger khi code BE thay đổi

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./CleaningServiceApp # Chỉ định thư mục chứa Dockerfile
          file: ./CleaningServiceApp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cleaning-api:latest