name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "CleaningServiceApp/**"
      - ".github/quality/**"
      - ".github/scripts/**"
      - ".github/codex/**"
      - ".github/workflows/backend-ci.yml"
      - ".agents/skills/**"
  push:
    branches:
      - main
      - master
    paths:
      - "CleaningServiceApp/**"
      - ".github/quality/**"
      - ".github/scripts/**"
      - ".github/codex/**"
      - ".github/workflows/backend-ci.yml"
      - ".agents/skills/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_FILE: CleaningServiceApp/CleaningServiceApp.sln
  API_PROJECT: CleaningServiceApp/CleaningService.API/CleaningService.API.csproj

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Verify formatting
        run: dotnet format "${{ env.SOLUTION_FILE }}" --verify-no-changes --no-restore --verbosity minimal

      - name: Enforce backend architecture
        shell: pwsh
        run: .github/scripts/check-backend-architecture.ps1

      - name: Enforce backend file size
        shell: pwsh
        run: .github/scripts/check-backend-file-size.ps1

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration Release --no-restore --disable-build-servers /m:1 /p:UseSharedCompilation=false

      - name: Publish API
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --no-restore --disable-build-servers /m:1 /p:UseSharedCompilation=false --output ./artifacts/api

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaning-api
          path: ./artifacts/api

  build-and-push-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build # Bắt buộc phải pass bước build .NET ở trên thì mới chạy Docker
    if: github.event_name != 'pull_request' # Chỉ push image lên Hub khi merge/push code, không push lúc tạo PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./CleaningServiceApp
          file: ./CleaningServiceApp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cleaning-api:latest