services:
  api:
    build: .
    image: buingoctam/cleaning-api:latest
    container_name: cleaning_api
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=PRM393_Cleaning;Username=${DB_USER};Password=${DB_PASSWORD}
      - JwtConfig__Secret=${JWT_SECRET}
      - JwtConfig__Issuer=CleaningAppBackend
      - JwtConfig__Audience=CleaningAppFlutter
      - JwtConfig__AccessTokenExpirationMinutes=15
      - JwtConfig__RefreshTokenExpirationDays=7
    networks:
      - cleaning_network

  db:
    image: postgres:16
    container_name: cleaning_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=PRM393_Cleaning
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d PRM393_Cleaning"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cleaning_network

networks:
  cleaning_network:
    driver: bridge

volumes:
  postgres_data:
